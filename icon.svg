<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="1" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- Checklist (white) -->
  <g transform="translate(70,70) scale(0.7)">
    <rect x="0" y="0" width="260" height="220" rx="12" fill="#ffffff" opacity="0.95"/>
    <g fill="#1565c0">
      <rect x="28" y="28" width="180" height="16" rx="8"/>
      <rect x="28" y="68" width="180" height="16" rx="8"/>
      <rect x="28" y="108" width="180" height="16" rx="8"/>
      <rect x="28" y="148" width="180" height="16" rx="8"/>
    </g>
    <g fill="#1565c0" transform="translate(220,20) scale(0.9)">
      <path d="M6.2 12.7l-3.9-3.9-1.8 1.8L6.2 16.3 20.7 1.8l-1.8-1.8z"/>
      <path d="M6.2 52.7l-3.9-3.9-1.8 1.8L6.2 56.3 20.7 41.8l-1.8-1.8z" transform="translate(0,-40)"/>
      <path d="M6.2 92.7l-3.9-3.9-1.8 1.8L6.2 96.3 20.7 81.8l-1.8-1.8z" transform="translate(0,-80)"/>
