    <!-- $ symbol -->
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#1565c0" text-anchor="middle">$</text>
  </g>

  <!-- small pie chart accent -->
  <g transform="translate(370,110)">
    <path d="M0 0 L40 0 A40 40 0 1 1 0.01 0 Z" fill="#ffffff" opacity="0.95"/>
